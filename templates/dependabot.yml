# Copy to .github/dependabot.yml. Lesson: GitHub 6.
# Dependabot opens PRs to keep these up to date. Remove ecosystems you don't use.
version: 2
updates:
  - package-ecosystem: "github-actions"   # keeps uses: actions/...@vX current
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"              # also: pip, composer, bundler, gomod, cargo, maven…
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:                    # one PR for small updates instead of many
        update-types: ["minor", "patch"]

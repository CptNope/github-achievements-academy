# Copy to .github/release.yml. Lesson: GitHub 5.
# Groups "Generate release notes" output by PR label.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: 🚀 Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Docs
      labels: [docs]
    - title: Other changes
      labels: ["*"]

# Copy to .github/ISSUE_TEMPLATE/bug-report.yml. Lesson: GitHub 2.
name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.4.2
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 131 on macOS 15

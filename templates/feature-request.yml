# Copy to .github/ISSUE_TEMPLATE/feature-request.yml. Lesson: GitHub 2.
name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
